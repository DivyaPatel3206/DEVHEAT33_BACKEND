<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FORGE_OS // PDF_DECODER</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --cyan: #00f0ff;
      --magenta: #ff00ff;
      --bg: #00050a;
      --panel-bg: rgba(0, 240, 255, 0.05);
      --panel-border: rgba(0, 240, 255, 0.3);
      --muted: rgba(255,255,255,0.7);
    }

    * { box-sizing: border-box; }

    body {
      background: var(--bg);
      color: white;
      font-family: 'Courier New', monospace;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background-image: radial-gradient(circle at center, #001a33 0%, #00050a 100%);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      padding: 50px;
      height: 100vh;
      perspective: 1200px;
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(10px);
      padding: 40px;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.1), inset 0 0 20px rgba(0, 240, 255, 0.05);
      border-radius: 14px;
    }

    .left { transform: rotateY(10deg); }
    .right { transform: rotateY(-10deg); }

    .label {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      letter-spacing: 5px;
      color: var(--cyan);
      margin-bottom: 18px;
      display: block;
      border-left: 3px solid var(--cyan);
      padding-left: 10px;
      text-transform: uppercase;
    }

    .upload-box {
      border: 1px dashed var(--magenta);
      padding: 46px 26px;
      text-align: center;
      cursor: pointer;
      color: var(--magenta);
      transition: 0.3s;
      border-radius: 14px;
      user-select: none;
    }

    .upload-box:hover {
      background: rgba(255, 0, 255, 0.05);
      box-shadow: 0 0 20px rgba(255, 0, 255, 0.2);
    }

    input[type="file"] { display: none; }

    #status-text {
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 3px;
      font-weight: 900;
      font-size: 12px;
    }

    #file-name {
      margin-top: 15px;
      font-size: 11px;
      color: white;
      opacity: 0.7;
      word-break: break-all;
    }

    .btn {
      width: 100%;
      margin-top: 18px;
      padding: 18px 16px;
      background: transparent;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      letter-spacing: 6px;
      cursor: pointer;
      transition: 0.35s;
      border-radius: 14px;
    }

    .btn:hover {
      background: var(--cyan);
      color: black;
      box-shadow: 0 0 50px var(--cyan);
    }

    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .tiny { margin-top: 10px; font-size: 12px; color: var(--muted); }

    #output {
      height: 560px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.8;
      color: #a0eaff;
      padding: 10px;
      border-top: 1px solid rgba(0, 240, 255, 0.12);
      white-space: pre-wrap;
      scrollbar-width: thin;
      scrollbar-color: var(--cyan) transparent;
    }

    .magenta { color: var(--magenta); }
    .cyan { color: var(--cyan); }

    @media (max-width: 980px) {
      body { overflow: auto; }
      .grid { grid-template-columns: 1fr; height: auto; padding: 18px; }
      .left, .right { transform: none; }
      #output { height: 520px; }
    }
  </style>
</head>

<body>
<div class="grid">

  <!-- LEFT: upload -->
  <div class="panel left">
    <span class="label">SOURCE_FEED // PDF_INPUT</span>

    <form id="pdf-form">
      <label class="upload-box" id="drop-zone">
        <!-- MUST be name="file" for FastAPI -->
        <input type="file" name="file" id="file-input" accept=".pdf,application/pdf">
        <div id="status-text">[ SELECT_DOCUMENT_SOURCE ]</div>
        <div id="file-name"></div>
      </label>

      <button class="btn" id="btnExtract" type="submit">EXTRACT_TEXT</button>
      <div class="tiny">Accepted: pdf</div>
    </form>
  </div>

  <!-- RIGHT: output -->
  <div class="panel right">
    <span class="label">NEURAL_DECODE // TEXT_STREAM</span>
    <div id="output">> SYSTEM_IDLE: Awaiting uplink...</div>
  </div>

</div>

<script>
  const form = document.getElementById("pdf-form");
  const fileInput = document.getElementById("file-input");
  const fileNameDisplay = document.getElementById("file-name");
  const output = document.getElementById("output");
  const btn = document.getElementById("btnExtract");
  const dropZone = document.getElementById("drop-zone");

  fileInput.onchange = () => {
    const f = fileInput.files?.[0];
    if (f) {
      fileNameDisplay.textContent = `FILE_LOADED: ${f.name}`;
      output.textContent = `> READY: ${f.name}\n> Press EXTRACT_TEXT to begin.`;
    } else {
      fileNameDisplay.textContent = "";
    }
  };

  // Drag/drop optional
  dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.style.opacity = 0.85; });
  dropZone.addEventListener("dragleave", () => { dropZone.style.opacity = 1; });
  dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.style.opacity = 1;
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
      fileInput.files = e.dataTransfer.files;
      fileInput.onchange();
    }
  });

  form.onsubmit = async (e) => {
    e.preventDefault();
    const f = fileInput.files?.[0];
    if (!f) return alert("No PDF selected.");

    btn.disabled = true;
    output.innerHTML = `<span class="cyan">> INITIALIZING_CORE...\n> EXTRACTING_TEXT_LAYERS...\n> PLEASE_WAIT...</span>`;

    try {
      const formData = new FormData();
      formData.append("file", f); // MUST be "file"

      const res = await fetch("/extract-pdf-text", { method: "POST", body: formData });
      const data = await res.json().catch(() => ({}));

      btn.disabled = false;

      if (!res.ok) {
        const msg = data?.detail
          ? (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail))
          : `HTTP ${res.status}`;
        output.innerHTML = `<span class="magenta">> CRITICAL_ERROR: ${msg}</span>`;
        return;
      }

      output.innerHTML =
        `<span class="cyan">> EXTRACT_COMPLETE ✅</span>\n\n` +
        `FILE: ${data.filename}\n` +
        `TEXT_LENGTH: ${data.text_length}\n\n` +
        `----------------------------------------\n` +
        `${(data.text || "")}`;

    } catch (err) {
      btn.disabled = false;
      output.innerHTML = `<span class="magenta">> CONNECTION_LOST: Server response failed.</span>`;
    }
  };
</script>
</body>
</html>
